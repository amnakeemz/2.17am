<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>2:17 AM</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

    <!-- =========================
         CINEMATIC BACKGROUND
    ========================== -->

    <div id="background"></div>
    <div id="background-glow"></div>
    <div id="background-overlay"></div>

    <div id="scanlines"></div>
    <div id="vignette"></div>

    <!-- =========================
         CAMERA
    ========================== -->

    <div id="camera">

        <div id="scene-world">

            <!-- ROOM -->

            <div id="room">

                <div class="ceiling"></div>

                <div class="wall wall-left"></div>
                <div class="wall wall-center"></div>
                <div class="wall wall-right"></div>

                <div class="floor"></div>

                <!-- BED -->

                <div id="bed">

                    <div class="bed-frame"></div>

                    <div class="mattress">
                        <div class="blanket"></div>
                        <div class="pillow"></div>
                    </div>

                    <div class="bed-shadow"></div>

                </div>

                <!-- CLOCK -->

                <div id="wall-clock">
                    <div class="clock-face">
                        <div class="clock-number n12">12</div>
                        <div class="clock-number n3">3</div>
                        <div class="clock-number n6">6</div>
                        <div class="clock-number n9">9</div>

                        <div class="clock-hand hour"></div>
                        <div class="clock-hand minute"></div>
                    </div>
                </div>

                <!-- DOOR -->

                <div id="door-area">

                    <div id="hallway">

                        <div class="hall-light"></div>

                        <div class="hall-wall"></div>

                        <div class="hall-shadow"></div>

                    </div>

                    <div id="door-frame">

                        <div id="door">

                            <div class="door-surface">

                                <div class="door-panel top"></div>
                                <div class="door-panel bottom"></div>

                                <div id="door-handle"></div>

                            </div>

                        </div>

                    </div>

                </div>

                <!-- WINDOW -->

                <div id="window-area">

                    <div id="window-frame">

                        <div id="window">

                            <div class="night-sky"></div>

                            <div class="moon"></div>

                            <div class="window-building"></div>

                            <div id="window-shadow"></div>

                            <div class="curtain left"></div>
                            <div class="curtain right"></div>

                        </div>

                    </div>

                </div>

                <!-- PHONE -->

                <div id="phone-object">

                    <div class="phone-body">

                        <div id="phone-screen">

                            <div class="phone-status">
                                2:17 AM
                            </div>

                            <div class="phone-icon">
                                ☎
                            </div>

                            <div class="phone-caller">
                                UNKNOWN
                            </div>

                            <div class="phone-message">
                                Someone is calling...
                            </div>

                        </div>

                        <div class="phone-button"></div>

                    </div>

                    <div class="phone-glow"></div>

                </div>

                <!-- PERSON SHADOW -->

                <div id="person-shadow">

                    <div class="shadow-head"></div>
                    <div class="shadow-body"></div>
                    <div class="shadow-arm"></div>

                </div>

                <!-- MYSTERY BOX -->

                <div id="mystery-box">

                    <div class="box-top"></div>
                    <div class="box-body"></div>
                    <div class="box-lock"></div>

                </div>

            </div>

        </div>

    </div>


    <!-- =========================
         HUD
    ========================== -->

    <div id="top-hud">

        <div class="hud-title">
            2:17 AM
        </div>

        <div class="hud-right">

            <span id="scene-counter">
                SCENE 01
            </span>

            <button id="sound-button">
                🔊
            </button>

        </div>

    </div>


    <!-- =========================
         START SCREEN
    ========================== -->

    <section id="start-screen" class="screen active">

        <div class="start-content">

            <div class="small-label">
                AN INTERACTIVE HORROR STORY
            </div>

            <h1>2:17 AM</h1>

            <p class="start-description">
                You wake up at exactly 2:17 AM.
                <br>
                Something is wrong.
            </p>

            <button id="start-button" class="main-button">
                START
            </button>

            <div class="start-warning">
                HEADPHONES RECOMMENDED
            </div>

        </div>

    </section>


    <!-- =========================
         STORY SCREEN
    ========================== -->

    <section id="story-screen" class="screen">

        <div id="scene-information">

            <div id="scene-location">
                BEDROOM
            </div>

            <div id="scene-time">
                2:17 AM
            </div>

        </div>


        <div id="story-container">

            <div id="story-location">
                BEDROOM
            </div>

            <div id="story-time">
                2:17 AM
            </div>

            <div id="story-text"></div>

            <div id="choices"></div>

        </div>

    </section>


    <!-- =========================
         TRANSITION
    ========================== -->

    <div id="transition"></div>


    <!-- =========================
         SYSTEM MESSAGE
    ========================== -->

    <div id="system-message">
        SIGNAL LOST
    </div>


    <!-- =========================
         ENDING
    ========================== -->

    <section id="ending-screen" class="screen">

        <div id="death-effect"></div>

        <div class="ending-content">

            <div id="ending-id">
                ENDING 00
            </div>

            <h1 id="ending-title">
                YOU DIED
            </h1>

            <p id="ending-text"></p>

            <button id="restart-button" class="main-button">
                PLAY AGAIN
            </button>

        </div>

    </section>


    <!-- =========================
         LOADING
    ========================== -->

    <div id="loading-screen">

        <div class="loading-text">
            LOADING
        </div>

        <div class="loading-line">
            <div></div>
        </div>

    </div>

</div>

<script src="game.js"></script>

</body>
</html>
